services:
  db:
    image: mariadb:11
    container_name: lzybench-wp-db
    restart: "no"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: lzybench
      MYSQL_ROOT_PASSWORD: lzybenchroot
    volumes:
      - lzy_wp_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7-alpine
    container_name: lzybench-wp-redis
    restart: "no"

  wordpress:
    image: wordpress:6-apache
    container_name: lzybench-wp-app
    restart: "no"
    ports:
      - "${LZY_WP_HOST_PORT:-18080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: lzybench
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  lzy_wp_db:
