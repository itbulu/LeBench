# LZY Bench - Default Configuration
# LeZaiYun Benchmark Toolkit

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
LZY_VERSION="1.3.2-p1"
LZY_NAME="LZY Bench"
LZY_BRAND="LeZaiYun"

# ---------------------------------------------------------------------------
# Paths (relative to project root unless absolute)
# ---------------------------------------------------------------------------
LZY_RESULTS_DIR="results"
LZY_LOGS_DIR="logs"
LZY_REPORTS_DIR="reports"
LZY_TEMPLATES_DIR="templates"

# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------
LZY_REQUIRE_ROOT=1

# Default full run. Docker/WordPress 首次会拉镜像，耗时较长。
# 精简示例：system cpu memory disk network route streaming ipquality
LZY_DEFAULT_MODULES="system cpu memory disk network route streaming ipquality docker wordpress"

LZY_MODULE_TIMEOUT=0
LZY_KEEP_TEMP=0

# ---------------------------------------------------------------------------
# CPU
# ---------------------------------------------------------------------------
LZY_CPU_SYSBENCH_EVENTS=10000
LZY_CPU_SYSBENCH_THREADS=0
LZY_CPU_ENABLE_UNIXBENCH=1
LZY_CPU_ENABLE_GEEKBENCH=1

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
LZY_MEM_SYSBENCH_SIZE="1G"
LZY_MEM_SYSBENCH_THREADS=1

# ---------------------------------------------------------------------------
# Disk (fio)
# ---------------------------------------------------------------------------
LZY_DISK_TEST_DIR="/tmp/lzy-bench-disk"
LZY_DISK_FILE_SIZE="1G"
LZY_DISK_RUNTIME=30
LZY_DISK_IODEPTH=64
LZY_DISK_NUMJOBS=1
LZY_DISK_BLOCKSIZE="4k"
# dd 快测（1=开）；fio 正式测（1=开）
LZY_DISK_DD=1
LZY_DISK_FIO=1
LZY_DISK_DD_BS="1M"
LZY_DISK_DD_COUNT=1024

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
LZY_NET_SPEEDTEST=1
LZY_NET_PING_CT="www.baidu.com"
LZY_NET_PING_CU="www.163.com"
LZY_NET_PING_CM="www.10086.cn"
LZY_NET_PING_COUNT=4
# 三网 / CDN 下载测速（curl）。可改成真实运营商测速节点 URL。
LZY_NET_CN_SPEED=1
LZY_NET_CN_DL_TIMEOUT=25
LZY_NET_DL_CT_URL="https://mirrors.cloud.tencent.com/ubuntu/ls-lR.gz"
LZY_NET_DL_CU_URL="https://mirrors.aliyun.com/ubuntu/ls-lR.gz"
LZY_NET_DL_CM_URL="https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ls-lR.gz"
LZY_NET_DL_INTL_URL="https://speed.cloudflare.com/__down?bytes=25000000"
# ---------------------------------------------------------------------------
# Route
# ---------------------------------------------------------------------------
LZY_ROUTE_MAX_HOPS=15
LZY_ROUTE_TARGET_CT="202.97.62.1"
LZY_ROUTE_TARGET_CU="202.106.196.115"
LZY_ROUTE_TARGET_CM="221.179.155.161"

# ---------------------------------------------------------------------------
# Streaming
# ---------------------------------------------------------------------------
LZY_STREAM_TIMEOUT=8
LZY_STREAM_DEBUG=0

# ---------------------------------------------------------------------------
# Application / Docker / WordPress (Phase 3)
# ---------------------------------------------------------------------------
# Auto-install Docker via get.docker.com if missing
LZY_DOCKER_AUTO_INSTALL=1
# Remove test containers / compose stack after run
LZY_APP_CLEANUP=1
LZY_APP_WORKDIR="/tmp/lzy-bench-app"

LZY_DOCKER_IMAGE_NGINX="nginx:alpine"
LZY_DOCKER_IMAGE_REDIS="redis:7-alpine"
LZY_DOCKER_IMAGE_MYSQL="mysql:8.0"
LZY_DOCKER_WAIT_SEC=90
LZY_DOCKER_MYSQL_WAIT_SEC=180

LZY_WP_HOST_PORT=18080
LZY_WP_WAIT_SEC=240

# Short stability loop during docker module (0=off)
LZY_STABILITY_ENABLE=0
LZY_STABILITY_ROUNDS=20

# ---------------------------------------------------------------------------
# Scoring weights
# ---------------------------------------------------------------------------
LZY_WEIGHT_CPU=20
LZY_WEIGHT_MEMORY=10
LZY_WEIGHT_DISK=20
LZY_WEIGHT_NETWORK=20
LZY_WEIGHT_ROUTE=10
LZY_WEIGHT_APPLICATION=10
LZY_WEIGHT_PRICE=10

# LZY_PRICE=5

LZY_SCORE_REF_CPU_MULTI=8000
LZY_SCORE_REF_CPU_SINGLE=2000
LZY_SCORE_REF_MEM_MIB=8000
LZY_SCORE_REF_DISK_SEQ=500
LZY_SCORE_REF_DISK_IOPS=20000
LZY_SCORE_REF_NET_DL=1000
LZY_SCORE_REF_NET_UL=500
LZY_SCORE_REF_NET_PING=20
LZY_SCORE_REF_NET_CN_DL=500
LZY_SCORE_REF_PRICE=5
LZY_SCORE_REF_TTFB=200
LZY_SCORE_REF_WP_TOTAL_MS=500
LZY_SCORE_REF_WP_DEPLOY_MS=90000
LZY_SCORE_REF_DOCKER_NGINX_MS=15000
LZY_SCORE_REF_DOCKER_REDIS_MS=10000
LZY_SCORE_REF_DOCKER_MYSQL_MS=45000

# ---------------------------------------------------------------------------
# Platform (Phase 4)
# ---------------------------------------------------------------------------
LZY_PLATFORM_API="http://127.0.0.1:8787"
# Optional: LZY_PLATFORM_TOKEN=
# Optional upload metadata:
# LZY_UPLOAD_LABEL="HK-Lite"
# LZY_UPLOAD_PROVIDER="DemoCloud"
# LZY_UPLOAD_REGION="HK"
